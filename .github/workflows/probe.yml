name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -w "index %{http_code}\n" -A "Mozilla/5.0" https://www.pokemon-card.com/card-search/index.php
          curl -s -A "Mozilla/5.0" "https://www.pokemon-card.com/card-search/resultAPI.php?keyword=&se_ta=&regulation_sidebar_form=all&pg=963&illust=&sm_and_keyword=true&page=1" | head -c 300; echo
          curl -s -o /dev/null -w "details %{http_code}\n" -A "Mozilla/5.0" https://www.pokemon-card.com/card-search/details.php/card/50816/regu/all
          curl -s -o /dev/null -w "img %{http_code} %{size_download}\n" -A "Mozilla/5.0" https://www.pokemon-card.com/assets/images/card_images/large/MG/050816_P_MODAIRUIEKKUSU.jpg
