# MyCard シングル買取表 自動作成の設定

# Webページ・PDFに表示するタイトルなど
title: ポケモンカード シングル買取表

# X投稿の本文
# {updated} は更新日時、{featured} は目玉カードの一覧（1行1枚）に置き換わります
# ※本文にURLを入れるとX APIの料金が1回$0.015→$0.20に上がるため、URLは入れない運用
x_post:
  max_featured: 3            # 本文に載せる目玉カードの枚数
  text: |
    【シングル買取価格 更新】
    {updated}

    {featured}

    ほか多数のカードを買取中！
    全カードの買取価格はプロフィールのリンクから👀

    #ポケカ #ポケカ買取 #取手 #MyCard
  # 目玉カード1行の書式（{name}{rarity}{price} が使えます）
  featured_line: "▶ {name} {rarity} ¥{price}"
